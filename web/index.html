<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hub</title>
  <meta name="description" content="Assignments, Bible reading, events and health in one place.">
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hub">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1 id="greeting">Hello</h1>
        <p id="date" class="muted"></p>
      </div>
      <div class="top-actions">
        <button class="icon-btn lg" data-action="sync" aria-label="Refresh">
          <svg class="sync-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12A8 8 0 0 1 18.3 7.1M18.5 3v4.3h-4.3M5.5 21v-4.3h4.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn lg" data-action="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <section id="today" class="today" aria-label="Today at a glance"></section>

    <div class="grid">
      <div class="col">
        <section class="card" id="card-assignments" data-kind="assign">
          <h2><span class="mark"></span>Assignments</h2>
          <div id="assignments"></div>
        </section>
        <section class="card" id="card-events" data-kind="events">
          <h2><span class="mark"></span>Upcoming</h2>
          <div id="events"></div>
        </section>
        <section class="card" id="card-reminders" data-kind="reminders">
          <h2><span class="mark"></span>Reminders</h2>
          <div id="reminders"></div>
        </section>
      </div>
      <div class="col">
        <section class="card" id="card-bible" data-kind="bible">
          <h2><span class="mark"></span>Bible reading</h2>
          <div id="bible"></div>
        </section>
        <section class="card" id="card-health" data-kind="health">
          <h2><span class="mark"></span>Health</h2>
          <div id="health"></div>
        </section>
      </div>
    </div>
  </main>

  <dialog id="modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-btn" data-action="close" aria-label="Close">×</button>
    </div>
    <div id="modal-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
